version: '3.8'

services:
  mongodb:
    image: mongo:8.0
    container_name: crowd_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - crowd_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crowd_backend
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - DEBUG=False
      - SECRET_KEY=prod_super_secret_crowd_event_key_2026
      - DB_ENGINE=mongodb
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB_NAME=crowd_event_db
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:80
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - crowd_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crowd_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - crowd_network

volumes:
  mongo_data:

networks:
  crowd_network:
    driver: bridge
